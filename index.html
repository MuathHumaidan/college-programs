header{background:linear-gradient(135deg,var(--dark),var(--darker));color:#fff;padding:22px 24px}
.wrap{width:100%;max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:flex-start;gap:14px;max-width:none}
.logo{width:60px;height:66px;flex:none;object-fit:contain}
h1{margin:0;font-size:clamp(20px,3.4vw,30px);font-weight:700;line-height:1.3}
main{flex:1;padding:28px 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
a.card:hover,a.card:focus-visible{border-color:var(--green);box-shadow:0 8px 22px rgba(18,58,43,.12);transform:translateY(-2px);outline:none}
.ico{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--green);display:grid;place-items:center}
.ico svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h2{margin:4px 0 0;font-size:20px;font-weight:700;color:var(--dark)}
.card p{margin:0;color:var(--mute);font-size:15px;flex:1}
.go{align-self:flex-start;margin-top:8px;background:var(--green);color:#fff;border-radius:10px;padding:6px 18px;font-weight:700;font-size:15px}
.wait{align-self:flex-start;margin-top:8px;background:var(--waitbg);color:var(--wait);border-radius:10px;padding:6px 14px;font-weight:700;font-size:14px}
.card.off .ico{background:#EEF1EF;color:#8B9A92}
footer{padding:0 16px 26px;color:var(--mute);font-size:14px}
footer .clear{background:none;border:0;padding:0;font:inherit;color:var(--green);text-decoration:underline;cursor:pointer}
footer .note{background:var(--soft);border-radius:12px;padding:12px 16px;color:var(--dark)}
</style>
</head>

<script>

  exam:'<path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4M9 11h7M9 15h7M9 19h4"/>'
};
const PROGRAMS=[
  {name:'متابعة التحضير',desc:'نسب تسجيل التحضير لدى المدربين وغياب المتدربين.',icon:'check',file:'programs/attendance.html'},
  {name:'جداول الكلية',desc:'جداول المتدربين والمدربين والقاعات والمواد المتبقية.',icon:'grid',file:'programs/schedules.html'},
